<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plane Crash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div>✈️ SKY ACE</div>
    <div>Score: <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>🏆 <span id="highScore">0</span></div>
  </div>

  <div id="message">
    <h1>✈️PLANE CRASH</h1>
    <p>Choose any plane, fly it and crash it.</p>
    <p>Move: WASD / Arrow Keys • Shoot: Space</p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
