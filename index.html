<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas"></canvas>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="screen">

        <div class="menuCard">

            <div class="logo">✈️</div>

            <h1>AIRLINE PILOT</h1>

            <p class="subtitle">
                Choose your aircraft
            </p>

            <div id="planeChoices">

                <button class="planeChoice selected"
                        data-plane="emirates">

                    <span class="planePreview emiratesPlane">✈</span>

                    <strong>Emirates</strong>

                    <small>Dubai</small>

                </button>


                <button class="planeChoice"
                        data-plane="qatar">

                    <span class="planePreview qatarPlane">✈</span>

                    <strong>Qatar Airways</strong>

                    <small>Doha</small>

                </button>


                <button class="planeChoice"
                        data-plane="british">

                    <span class="planePreview britishPlane">✈</span>

                    <strong>British Airways</strong>

                    <small>London</small>

                </button>

            </div>


            <button id="startButton">
                START FLIGHT
            </button>

            <p class="controls">
                ↑ ↓ ← → or WASD to fly
            </p>

        </div>

    </div>


    <!-- HUD -->
    <div id="hud">

        <span id="airlineName"></span>

        <span>
            <b id="distance">0</b> km
        </span>

    </div>


    <!-- CRASH SCREEN -->
    <div id="crashScreen"
         class="screen hidden">

        <div class="crashCard">

            <div class="crashIcon">💥</div>

            <h2>CRASHED!</h2>

            <p id="crashMessage">
                Your aircraft crashed.
            </p>

            <p>
                Distance flown:
                <strong id="finalDistance">0</strong>
                km
            </p>

            <button id="menuButton">
                CHOOSE ANOTHER PLANE
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
