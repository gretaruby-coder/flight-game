<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas"></canvas>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="screen">

        <div class="menuCard">

            <div class="logo">✈️</div>

            <h1>AIRLINE PILOT</h1>

            <p class="subtitle">
                Choose your aircraft
            </p>

            <div id="planeChoices">

    <button type="button" class="planeChoice selected" data-plane="emirates">

        <div class="aircraftPreview emiratesAircraft">
    <div class="aircraft">
        <div class="fuselage"></div>
        <div class="leftWing"></div>
        <div class="rightWing"></div>
        <div class="leftTail"></div>
        <div class="rightTail"></div>
        <div class="tailFin"></div>
    </div>
</div>

<strong>Emirates</strong>
<small>A380 • Dubai</small>

    </button>


  <button type="button" class="planeChoice" data-plane="qatar">
       <div class="aircraftPreview qatarAircraft">
    <div class="aircraft">
        <div class="fuselage"></div>
        <div class="leftWing"></div>
        <div class="rightWing"></div>
        <div class="leftTail"></div>
        <div class="rightTail"></div>
        <div class="tailFin"></div>
    </div>
</div>

<strong>Qatar Airways</strong>
<small>Boeing 777 • Doha</small>

    </button>


   <button type="button" class="planeChoice" data-plane="british">

       <div class="aircraftPreview britishAircraft">
    <div class="aircraft">
        <div class="fuselage"></div>
        <div class="leftWing"></div>
        <div class="rightWing"></div>
        <div class="leftTail"></div>
        <div class="rightTail"></div>
        <div class="tailFin"></div>
    </div>
</div>

<strong>British Airways</strong>
<small>787 Dreamliner • London</small>

    </button>

</div>


            <button id="startButton" type="button">
    START FLIGHT
</button>

            <p class="controls">
                ↑ ↓ ← → or WASD to fly
            </p>

        </div>

    </div>


    <!-- HUD -->
    <div id="hud">

        <span id="airlineName"></span>

        <span>
            <b id="distance">0</b> km
        </span>

    </div>


    <!-- CRASH SCREEN -->
    <div id="crashScreen"
         class="screen hidden">

        <div class="crashCard">

            <div class="crashIcon">💥</div>

            <h2>CRASHED!</h2>

            <p id="crashMessage">
                Your aircraft crashed.
            </p>

            <p>
                Distance flown:
                <strong id="finalDistance">0</strong>
                km
            </p>

            <button id="menuButton">
                CHOOSE ANOTHER PLANE
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
